name: Validasi data

on:
  push:
    paths: ['master.json', 'images/**', 'scripts/validate-master.mjs']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-master.mjs
